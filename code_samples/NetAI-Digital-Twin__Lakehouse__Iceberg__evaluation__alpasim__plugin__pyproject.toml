[project]
name = "alpasim-harness"
version = "0.1.0"
description = "Run this project's evaluation Policy objects inside AlpaSim (validation bridge)"
requires-python = ">=3.10"
dependencies = ["numpy"]

# Registers the bridge with AlpaSim's plugin registry. Nothing in the AlpaSim
# checkout is modified; `uv run alpasim-info` will list `harness` once installed.
[project.entry-points."alpasim.models"]
harness = "alpasim_harness.harness_model:HarnessPolicyModel"

[project.entry-points."alpasim.configs"]
harness = "alpasim_harness.configs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpasim_harness"]
