# =============================================================================
# Lakehouse Helm values — the complete set of definable variables.
# Defaults mirror docker-compose / .env.example (in-cluster dev parity).
# Override per environment with -f values-prod.yaml (see that file).
# Non-secret keys -> ConfigMap; `secrets:` -> a K8s Secret (or reference an
# externally-managed one via secrets.existingSecret).
# =============================================================================
global:
  imagePullPolicy: IfNotPresent
  storageClass: ""            # "" = cluster default; set per-env

# --- Application config (ConfigMap; consumed as env by spark/ingestion pods) --
config:
  polarisUri: "http://polaris:8181/api/catalog"
  polarisCatalogName: "lakehouse_catalog"
  polarisScope: "PRINCIPAL_ROLE:ALL"
  awsS3Endpoint: "http://minio:9000"
  awsRegion: "us-east-1"
  s3Bucket: "warehouse"
  sparkCatalogName: "iceberg"
  sparkDriverMemory: "32g"
  # Raw data mount (register-in-place -> STABLE path; = rawData.mountPath):
  nvidiaSourcePath: "/data/raw/nvidia-physicalai-av-subset"
  nvidiaNsBronze: "nvidia_bronze"
  nvidiaNsSilver: "nvidia_silver"
  nvidiaNsGold: "nvidia_gold"
  nvidiaLidarMode: "blob"
  nvidiaSilverMode: "view"
  nvidiaGoldMode: "materialized"

# --- Secrets (override in prod; NEVER commit real values) --------------------
secrets:
  existingSecret: ""          # if set, use this pre-created Secret and ignore values below
  polarisCredential: "root:s3cr3t"      # client_id:client_secret
  awsAccessKeyId: "minioadmin"
  awsSecretAccessKey: "minioadmin"
  postgresUser: "polaris"
  postgresPassword: "polaris"
  minioRootUser: "minioadmin"
  minioRootPassword: "minioadmin"
  polarisRootClientId: "root"
  polarisRootClientSecret: "s3cr3t"

postgres:
  image: "postgres:16"
  db: "polaris"
  storage: "10Gi"

minio:
  image: "quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z"
  storage: "200Gi"

polaris:
  image: "apache/polaris:latest"
  adminImage: "apache/polaris-admin-tool:latest"
  realm: "POLARIS"

spark:
  # Custom image with the ingestion code baked in (built by CI, see deploy/docker).
  image: "ghcr.io/OWNER/lakehouse-spark:latest"
  replicas: 1
  resources:
    requests: {cpu: "2", memory: "8Gi"}
    limits: {cpu: "8", memory: "40Gi"}

# --- Raw data (the uploaded SSD batches) -------------------------------------
# Register-in-place references absolute paths -> keep this mount STABLE.
rawData:
  existingClaim: ""           # RECOMMENDED in prod: a PVC the cluster admin binds
                              # to the storage-cluster upload location (e.g. "lakehouse-rawdata")
  mountPath: "/data/raw"
  # Chart-managed PVC (used only when existingClaim is empty):
  size: "20Ti"
  accessMode: "ReadOnlyMany"
